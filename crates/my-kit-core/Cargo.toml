[package]
name = "my-kit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless core utilities, algorithms, forms, media, and auth engine for studio ventures"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }
thiserror = { workspace = true }
compact_str = { workspace = true }
ulid = { workspace = true }
secrecy = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["json", "forms", "media", "auth"]
json = ["dep:serde", "dep:serde_json"]
forms = ["json"]
media = []
auth = ["json", "dep:secrecy"]
async-timer = ["dep:tokio"]


